# ==============================================================================
# aaPanel Nginx Configuration Templates for Gopay Platform
# ==============================================================================

# ------------------------------------------------------------------------------
# OPTION 1: RECOMMENDED - Separate Subdomains
# ------------------------------------------------------------------------------

# --- [A] User Web Application (e.g. gopay.yourdomain.com) ---
# In aaPanel: Website -> Add Site -> Domain: yourdomain.com -> Root: /www/wwwroot/gopay_user_web
# Then click Site Settings -> "Config" (Nginx) and add these location blocks inside server { ... }:

location /api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:5000/uploads/;
    proxy_set_header Host $host;
}

# SPA Fallback for User Web React routes
location / {
    try_files $uri $uri/ /index.html;
}


# --- [B] Admin Dashboard (e.g. admin.yourdomain.com) ---
# In aaPanel: Website -> Add Site -> Domain: admin.yourdomain.com -> Root: /www/wwwroot/gopay_admin_panel
# Then click Site Settings -> "Config" (Nginx) and add these location blocks inside server { ... }:

location /api/ {
    proxy_pass http://127.0.0.1:5000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
}

location /uploads/ {
    proxy_pass http://127.0.0.1:5000/uploads/;
    proxy_set_header Host $host;
}

# SPA Fallback for Admin Panel routes
location / {
    try_files $uri $uri/ /index.html;
}


# ------------------------------------------------------------------------------
# OPTION 2: ALL-IN-ONE (Single Domain Reverse Proxy)
# If you run everything on a single domain (e.g. yourdomain.com)
# ------------------------------------------------------------------------------
# In aaPanel: Site Settings -> "Reverse Proxy" -> Add Reverse Proxy:
# Target URL: http://127.0.0.1:5000
# Sent Domain: $host
# Or paste inside server { ... }:

location / {
    proxy_pass http://127.0.0.1:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 50m;
}
